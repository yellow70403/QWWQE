
<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sales Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 30px;
}

.header {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.header h1 {
    margin-top: 0;
}

.info {
    color: #666;
    line-height: 1.8;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card-title {
    color: #777;
    font-size: 14px;
}

.card-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.chart-box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.chart-box.full {
    grid-column: 1 / -1;
}

.chart-container {
    height: 400px;
    position: relative;
}

@media (max-width: 900px) {
    .cards {
        grid-template-columns: 1fr 1fr;
    }

    .chart-grid {
        grid-template-columns: 1fr;
    }

    .chart-box.full {
        grid-column: auto;
    }
}

@media (max-width: 600px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }
}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>📊 教學用 Sales Dashboard</h1>

        <div class="info">

            目前資料表：
            <strong id="tableName"></strong>

            <br>

            本頁資料來自 MySQL，
            由 Python 重新產生靜態 index.html。

            <br>

            GitHub Pages 不直接連線 MySQL。

        </div>

    </div>


    <!-- 統計卡片 -->

    <div class="cards">

        <div class="card">

            <div class="card-title">
                紀錄筆數
            </div>

            <div class="card-value"
                 id="records">
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                售出數量
            </div>

            <div class="card-value"
                 id="quantity">
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                退貨數量
            </div>

            <div class="card-value"
                 id="returns">
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                淨銷售額
            </div>

            <div class="card-value"
                 id="netRevenue">
            </div>

        </div>

    </div>


    <!-- 圖表 -->

    <div class="chart-grid">


        <!-- 每日 -->

        <div class="chart-box full">

            <h2>
                每日淨銷售額
            </h2>

            <div class="chart-container">

                <canvas id="dailyChart"></canvas>

            </div>

        </div>


        <!-- 商品 -->

        <div class="chart-box">

            <h2>
                各商品淨銷售額
            </h2>

            <div class="chart-container">

                <canvas id="productChart"></canvas>

            </div>

        </div>


        <!-- 分類 -->

        <div class="chart-box">

            <h2>
                各分類淨銷售額占比
            </h2>

            <div class="chart-container">

                <canvas id="categoryChart"></canvas>

            </div>

        </div>


        <!-- 通路 -->

        <div class="chart-box">

            <h2>
                各通路淨銷售額比較
            </h2>

            <div class="chart-container">

                <canvas id="channelChart"></canvas>

            </div>

        </div>


        <!-- 散佈 -->

        <div class="chart-box">

            <h2>
                售出數量 vs 淨銷售額
            </h2>

            <div class="chart-container">

                <canvas id="scatterChart"></canvas>

            </div>

        </div>


    </div>

</div>

// ==========================

new Chart(
    document.getElementById("categoryChart"),
    {

        type: "pie",

        data: {

            labels:
                DATA.category.map(
                    x => x.category
                ),

            datasets: [{

                label: "淨銷售額",

                data:
                    DATA.category.map(
                        x => x.net_revenue
                    )

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                tooltip: {

                    callbacks: {

                        label: function(context) {

                            let total =
                                DATA.category.reduce(
                                    (sum, x) =>
                                        sum +
                                        Number(x.net_revenue),

                                    0
                                );

                            let value =
                                Number(context.raw);

                            let percent =
                                total === 0
                                ? 0
                                : value / total * 100;

                            return context.label +
                                ": " +
                                money(value) +
                                " (" +
                                percent.toFixed(1) +
                                "%)";

                        }

                    }

                }

            }

        }

    }
);
